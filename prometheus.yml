global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'modular-monolith'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'modular-monolith-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
